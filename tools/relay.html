<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title></head>
<body><p id="s">Cargando…</p>
<script>
(async function(){
  var s=document.getElementById('s');
  try{
    var f=new URLSearchParams(location.search).get('f');
    var r=await fetch('https://raw.githubusercontent.com/arcano852-rgb/sofistemas/videos-temp/v/'+encodeURIComponent(f));
    var buf=await r.arrayBuffer();
    var target=window.opener;
    if(!target){s.textContent='sin opener';return;}
    target.postMessage({sofiRelay:true,name:f,buf:buf},'https://business.facebook.com',[buf]);
    s.textContent='Enviado '+f;
    setTimeout(function(){window.close();},1500);
  }catch(e){s.textContent='error '+e.message;}
})();
</script></body></html>
